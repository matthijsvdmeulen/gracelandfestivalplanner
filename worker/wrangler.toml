# Cloudflare Worker die de gedeelde planning bewaart.
#
# Eenmalig opzetten:
#   npm install -g wrangler && wrangler login
#   wrangler kv namespace create PLANNER      # vul de id hieronder in
#   wrangler secret put GROUP_SALT            # lange willekeurige tekst
#   wrangler deploy
#
# De route hangt de Worker voor GitHub Pages langs. Dat werkt alleen als het
# DNS-record van gracelandplanner.meulen.dev in Cloudflare geproxyd staat
# (oranje wolk). Alles buiten /api/* gaat gewoon door naar GitHub Pages.

name = "gracelandplanner-api"
main = "index.js"
compatibility_date = "2026-08-01"

# Logs en foutmeldingen terugzien in het Cloudflare-dashboard. Zonder dit is
# een Worker die stukloopt alleen zichtbaar als een 500 in de browser.
[observability]
enabled = true

# De binding heet PLANNER omdat index.js env.PLANNER leest. Het voorbeeld dat
# Cloudflare bij een nieuwe namespace toont noemt hem KV; die naam overnemen
# betekent dat de Worker geen opslag meer vindt.
[[kv_namespaces]]
binding = "PLANNER"
id = "194fc7e4a6e44584a1e2b2ee5aadb170"

[[routes]]
pattern = "gracelandplanner.meulen.dev/api/*"
zone_name = "meulen.dev"
