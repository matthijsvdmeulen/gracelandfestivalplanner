<!-- Nagebouwd naar de echte structuur: de podiumnamen staan in een eigen
     kolom (--column-locations), de blokken in een tweede kolom
     (--column-timeline). De volgorde koppelt de twee. -->
<html><body><main><div class="tw-w-screen timetable__grid">
<div class="timetable__grid--column-locations">
  <div class="timetable__location"><div class="timetable__stage" style="height: 120px;">Grasland</div></div>
  <div class="timetable__location"><div class="timetable__stage" style="height: 120px;">Wilde nis</div></div>
</div>
<div class="timetable__grid--column-timeline">
<div class="timetable__location">
  <div class="timetable__timeline">
    <div class="timetable__performance"><a><span>Testartiest</span>
      <div class="timetable__performance-times">17:00 - 18:00</div></a></div>
    <div class="timetable__performance"><a><span>Alleen In Het Blokkenschema</span>
      <div class="timetable__performance-times">21:00 - 22:00</div></a></div>
  </div></div>
<div class="timetable__location">
  <div class="timetable__timeline">
    <div class="timetable__performance"><a><span>Nachtset</span>
      <div class="timetable__performance-times">22:00 - 00:00</div></a></div>
  </div></div>
</div>
</div></main></body></html>
